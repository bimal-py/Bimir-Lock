allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Relocate the Gradle build directory to <flutter project>/build.
// Project.buildDir is deprecated in Gradle 8 and removed in Gradle 9;
// layout.buildDirectory is the supported replacement and resolves to the
// exact same directories the previous `rootProject.buildDir = '../build'` did.
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
